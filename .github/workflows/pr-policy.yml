name: PR policy

# Enforces AI_POLICY.md and commit conventions on every pull request.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  ai-disclosure:
    name: AI disclosure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Unit-test the checker
        run: python3 -m unittest scripts/test_check_ai_disclosure.py
      - name: Check PR description and commits
        # The body is passed through an env var, never interpolated into the
        # script, so a PR description can't inject shell commands.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          python3 scripts/check_ai_disclosure.py --body "$RUNNER_TEMP/pr-body.md" --range "$BASE_SHA..$HEAD_SHA"

  commit-messages:
    name: Conventional commits
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check every commit message
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            if ! scripts/hooks/commit-msg "$RUNNER_TEMP/msg"; then
              echo "::error::commit $(git log -1 --format='%h %s' "$sha") fails the commit-msg rules"
              status=1
            fi
          done
          exit $status

name: Release

# Push a tag like v0.2.0 to publish a GitHub Release. See docs/releasing.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libsqlite3-dev libgtest-dev \
            qt6-base-dev qt6-multimedia-dev libgl1-mesa-dev
      - name: Check the tag matches the CMake project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^  VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match CMakeLists.txt VERSION $version"
            exit 1
          fi
      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DGLIMMER_WITH_WHISPER=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          cmake --install build --prefix "stage/glimmer-${GITHUB_REF_NAME}"
          cp README.md LICENSE CHANGELOG.md "stage/glimmer-${GITHUB_REF_NAME}/"
          tar -C stage -czf "glimmer-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" "glimmer-${GITHUB_REF_NAME}"
          sha256sum glimmer-*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            glimmer-*.tar.gz
            SHA256SUMS

  publish:
    needs: build-linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # create the release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" glimmer-*.tar.gz SHA256SUMS \
            --title "glimmer $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
